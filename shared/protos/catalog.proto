syntax = "proto3";

option csharp_namespace = "ECommerce.Shared.Protos";

package catalog;

service CatalogGrpcService {
  rpc GetItem (GetItemRequest) returns (CatalogItemResponse);
  rpc GetItems (GetItemsRequest) returns (CatalogItemsResponse);
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
}

message GetItemRequest {
  string id = 1;
}

message GetItemsRequest {
  repeated string ids = 1;
}

message CatalogItemResponse {
  string id = 1;
  string title = 2;
  string sku = 3;
  double price = 4;
  int32 stock_quantity = 5;
  bool is_active = 6;
  string category_id = 7;
}

message CatalogItemsResponse {
  repeated CatalogItemResponse items = 1;
}

message CheckStockRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool is_available = 1;
  int32 available_quantity = 2;
}

message StockItemQuantity {
  string item_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  repeated StockItemQuantity items = 1;
}

message ReserveStockResponse {
  bool success = 1;
  string error_message = 2;
  string failed_item_id = 3;
  int32 available_quantity = 4;
  repeated CatalogItemResponse items = 5;
}

message ReleaseStockRequest {
  repeated StockItemQuantity items = 1;
}

message ReleaseStockResponse {
  bool success = 1;
}
